name: NLP Search & Prompt Engineering PR Trigger
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  sandbox-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ./app

      - name: Prepare Environment File
        run: |
          cp ./app/.env.clean ./app/.env

      - name: Spin up Docker Sandbox Environment
        run: |
          cd ./app/tests
          docker compose -f docker-compose.test.yml up -d --build
          sleep 5

      - name: Install Dependencies in Container
        run: |
          cd ./app/tests
          docker compose -f docker-compose.test.yml exec -T discovery_engine_be bash -l -c "npm ci"

      - name: Run Database Migrations in Container
        run: |
          cd ./app/tests
          docker compose -f docker-compose.test.yml exec -T discovery_engine_be bash -l -c "npm run migrate:up"

      - name: Run Unit and Localized Tests in Container
        run: |
          cd ./app/tests
          docker compose -f docker-compose.test.yml exec -T discovery_engine_be bash -l -c "npm test -- tests/services tests/graphql/nlp.test.ts"

      - name: Tear down Sandbox Environment
        if: always()
        run: |
          cd ./app/tests
          docker compose -f docker-compose.test.yml down -v
