name: SSM Smoke Test (ION EC2)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::038625727822:role/github-ssm-ion
          aws-region: ap-southeast-2

      - name: Send SSM command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "i-0306c8ceffb691568" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub SSM smoke test ${GITHUB_RUN_ID}" \
            --parameters 'commands=["set -e","whoami","hostname","date","uname -a","ip -brief addr"]' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "SSM CommandId: $CMD_ID"

      - name: Wait for result + print output
        run: |
          CMD_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE_ID="i-0306c8ceffb691568"

          # wait until the command finishes (Success/Failed/Cancelled/TimedOut)
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text || true)

            echo "Status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              break
            fi
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "---- STDERR ----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          # fail the workflow if command failed
          FINAL=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
          [[ "$FINAL" == "Success" ]]